services:
  web:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      PATCHBAY_STORAGE: postgres
      PATCHBAY_REQUIRE_ENROLLMENT_TOKEN: ${PATCHBAY_REQUIRE_ENROLLMENT_TOKEN:-true}
      PATCHBAY_REQUIRE_AGENT_TOKEN: ${PATCHBAY_REQUIRE_AGENT_TOKEN:-true}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: patchbay-caddy
    restart: unless-stopped
    environment:
      PATCHBAY_DOMAIN: ${PATCHBAY_DOMAIN:-localhost}
    ports:
      - "${PATCHBAY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${PATCHBAY_HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - patchbay-caddy-data:/data
      - patchbay-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  patchbay-caddy-data:
  patchbay-caddy-config:
